<html lang="en">

            <h5 class="card-title">Card 1</h5>
            <p class="card-text">This is the first card.</p>

        </div>
      </div>
      <div class="col">

          <img src="/assets/my_app/images/image2.jpg" class="card-img-top" alt="Image 2">

            <h5 class="card-title">Card 2</h5>
            <p class="card-text">This is the second card.</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <img src="/assets/my_app/images/image3.jpg" class="card-img-top" alt="Image 3">
          <div class="card-body">
            <h5 class="card-title">Card 3</h5>
            <p class="card-text">This is the third card.</p>
          </div>
        </div>

    </div>

</html>
