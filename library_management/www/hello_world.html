<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
</head>
<body>
  <button id="hello-button">Say Hello</button>

  <script>
    document.getElementById('hello-button').addEventListener('click', function() {
      alert('Hello, World!');
    });
  </script>
</body>
</html>
